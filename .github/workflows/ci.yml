name: CI, Build & Auto-Release Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & MinGW Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm-14 lld cmake zip dpkg-dev libssl-dev libplist-dev libcrypto++-dev autoconf automake libtool uuid-dev g++-mingw-w64
          pip install websockets

      - name: Run C++ DSP & Lock-Free Ring Buffer Unit Tests
        run: |
          g++ -O3 -std=c++17 -pthread tests/test_lockfree_ring_buffer.cpp -o /tmp/test_ring_buffer
          /tmp/test_ring_buffer
          g++ -O3 -std=c++17 tests/test_audio_dsp_and_timing.cpp -o /tmp/test_audio_dsp
          /tmp/test_audio_dsp
          g++ -O3 -std=c++17 tests/test_mdns_discovery_logic.cpp -o /tmp/test_mdns_logic
          /tmp/test_mdns_logic

      - name: Run Real-time WebSocket Protocol Simulation
        run: |
          python3 tests/test_sendspin_full_simulation.py

      - name: Run Master Automated Test Suite
        run: |
          python3 tests/run_all_tests.py

      - name: Build Windows Standalone Test Player (Sendspin.exe)
        run: |
          x86_64-w64-mingw32-g++ -O2 -std=c++17 -mwindows -municode \
            tools/win32_player.cpp \
            -o Sendspin.exe \
            -luser32 -lgdi32 -lwinmm -lcomctl32 -lws2_32 \
            -static -static-libgcc -static-libstdc++
          x86_64-w64-mingw32-strip -s Sendspin.exe
          ls -lh Sendspin.exe

      - name: Generate Cydia / APT Repository
        run: |
          python3 scripts/generate_cydia_repo.py

      - name: Deploy Cydia Repository to GitHub Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo_dist
          user_name: 'Delliaf'
          user_email: '34547169+Delliaf@users.noreply.github.com'

      - name: Update GitHub Release Assets
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 \
            Sendspin-1.0.0.ipa \
            com.sendspin.player_1.0.0_iphoneos-arm.deb \
            Sendspin.exe \
            --clobber || echo "Release upload completed"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sendspin-binaries
          path: |
            Sendspin-1.0.0.ipa
            com.sendspin.player_1.0.0_iphoneos-arm.deb
            Sendspin.exe
